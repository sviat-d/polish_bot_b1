<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="32" fill="#DC143C"/>
  <g transform="translate(100,100)">
    <!-- Graduation cap shape with 'p' integrated -->
    <!-- Top diamond/cap -->
    <polygon points="0,-62 72,-20 0,22 -72,-20" fill="white"/>
    <!-- Small red diamond in center -->
    <polygon points="0,-30 16,-14 0,2 -16,-14" fill="#DC143C"/>
    <!-- Bottom chevron/brim -->
    <polygon points="-72,-20 -72,-8 0,34 72,-8 72,-20 0,22" fill="white"/>
    <!-- Bottom box part -->
    <polygon points="-44,18 -44,52 0,74 44,52 44,18 0,40" fill="white"/>
    <!-- Inner gap for depth -->
    <polygon points="-44,18 0,40 44,18 0,-4" fill="#DC143C"/>
  </g>
</svg>
